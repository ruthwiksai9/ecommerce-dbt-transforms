name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  dbt-ci:
    name: dbt Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: etl_password
          POSTGRES_DB: ecommerce_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          ecommerce:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: etl_user
                password: etl_password
                dbname: ecommerce_dw
                schema: raw
                threads: 2
          EOF

      - name: Create raw schema and seed data
        env:
          PGPASSWORD: etl_password
        run: |
          psql -h localhost -U etl_user -d ecommerce_dw <<'SQL'
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS intermediate;
          CREATE SCHEMA IF NOT EXISTS marts;
          CREATE SCHEMA IF NOT EXISTS analytics;
          CREATE SCHEMA IF NOT EXISTS seeds;

          CREATE TABLE IF NOT EXISTS raw.orders (
              order_id VARCHAR(50) PRIMARY KEY,
              customer_id VARCHAR(50),
              order_status VARCHAR(20),
              order_purchase_timestamp TIMESTAMP,
              order_approved_at TIMESTAMP,
              order_delivered_carrier_date TIMESTAMP,
              order_delivered_customer_date TIMESTAMP,
              order_estimated_delivery_date TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS raw.order_items (
              order_id VARCHAR(50),
              order_item_id INTEGER,
              product_id VARCHAR(50),
              seller_id VARCHAR(50),
              shipping_limit_date TIMESTAMP,
              price NUMERIC(10,2),
              freight_value NUMERIC(10,2)
          );
          CREATE TABLE IF NOT EXISTS raw.customers (
              customer_id VARCHAR(50) PRIMARY KEY,
              customer_unique_id VARCHAR(50),
              customer_zip_code_prefix VARCHAR(10),
              customer_city VARCHAR(100),
              customer_state VARCHAR(5)
          );
          CREATE TABLE IF NOT EXISTS raw.products (
              product_id VARCHAR(50) PRIMARY KEY,
              product_category_name VARCHAR(100),
              product_name_lenght INTEGER,
              product_description_lenght INTEGER,
              product_photos_qty INTEGER,
              product_weight_g NUMERIC,
              product_length_cm NUMERIC,
              product_height_cm NUMERIC,
              product_width_cm NUMERIC
          );
          CREATE TABLE IF NOT EXISTS raw.sellers (
              seller_id VARCHAR(50) PRIMARY KEY,
              seller_zip_code_prefix VARCHAR(10),
              seller_city VARCHAR(100),
              seller_state VARCHAR(5)
          );
          CREATE TABLE IF NOT EXISTS raw.order_payments (
              order_id VARCHAR(50),
              payment_sequential INTEGER,
              payment_type VARCHAR(30),
              payment_installments INTEGER,
              payment_value NUMERIC(10,2)
          );

          INSERT INTO raw.customers VALUES
              ('c1','u1','01310','sao paulo','SP'),
              ('c2','u2','20040','rio de janeiro','RJ'),
              ('c3','u3','30112','belo horizonte','MG');

          INSERT INTO raw.products VALUES
              ('p1','electronics',10,100,3,500,20,10,5),
              ('p2','furniture',15,200,5,2000,80,60,40),
              ('p3','electronics',8,80,2,300,15,8,4);

          INSERT INTO raw.sellers VALUES
              ('s1','04552','sao paulo','SP'),
              ('s2','22220','rio de janeiro','RJ');

          INSERT INTO raw.orders VALUES
              ('o1','c1','delivered','2021-01-15 10:00','2021-01-15 11:00','2021-01-16 09:00','2021-01-20 14:00','2021-01-25 00:00'),
              ('o2','c2','delivered','2021-03-22 14:30','2021-03-22 15:00','2021-03-23 08:00','2021-03-28 16:00','2021-04-01 00:00'),
              ('o3','c3','canceled','2021-06-01 09:15',NULL,NULL,NULL,'2021-06-15 00:00'),
              ('o4','c1','delivered','2021-09-10 17:45','2021-09-10 18:00','2021-09-11 07:00','2021-09-15 11:00','2021-09-20 00:00');

          INSERT INTO raw.order_items VALUES
              ('o1',1,'p1','s1','2021-01-17',29.99,5.00),
              ('o1',2,'p3','s1','2021-01-17',49.99,8.50),
              ('o2',1,'p2','s2','2021-03-25',299.99,25.00),
              ('o4',1,'p1','s1','2021-09-13',29.99,5.00);

          INSERT INTO raw.order_payments VALUES
              ('o1',1,'credit_card',1,34.99),
              ('o1',2,'credit_card',1,58.49),
              ('o2',1,'credit_card',3,324.99),
              ('o4',1,'boleto',1,34.99);
          SQL

      - name: dbt deps
        run: dbt deps

      - name: dbt compile
        run: dbt compile

      - name: dbt run
        run: dbt run

      - name: dbt test
        run: dbt test

      - name: dbt docs generate
        run: dbt docs generate

      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-docs
          path: target/
