name: ecommerce_dbt
version: "1.0.0"
config-version: 2

profile: ecommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_dbt:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      core:
        +schema: marts
        +materialized: table
      analytics:
        +schema: analytics
        +materialized: table

seeds:
  ecommerce_dbt:
    +schema: seeds
