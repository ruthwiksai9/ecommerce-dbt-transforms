version: 2

models:
  - name: stg_orders
    description: "Cleaned and standardized orders with derived time fields"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: ordered_at
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order items with freight ratio and total value"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customers with normalized city/state"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product catalog with derived volume_cm3"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Cleaned seller data"
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_order_payments
    description: "Cleaned payment records with installment flag"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null
