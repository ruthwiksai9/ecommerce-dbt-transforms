version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw Olist e-commerce data loaded by the ETL pipeline"
    tables:
      - name: orders
        description: "One row per order"
        columns:
          - name: order_id
            description: "Unique order identifier"
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

      - name: order_items
        description: "One row per item within an order"
        columns:
          - name: order_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null

      - name: customers
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            tests:
              - not_null

      - name: products
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: sellers
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null

      - name: order_payments
        columns:
          - name: order_id
            tests:
              - not_null
