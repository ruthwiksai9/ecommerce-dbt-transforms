version: 2

models:
  - name: dim_customers
    description: "Customer dimension with lifetime order history and segment"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              values: [one_time, repeat, loyal]

  - name: dim_products
    description: "Product dimension with sales history and demand tier"
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null
      - name: demand_tier
        tests:
          - accepted_values:
              values: [inactive, low, medium, high]

  - name: fact_orders
    description: "Order fact table enriched with payment and delivery metrics"
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
